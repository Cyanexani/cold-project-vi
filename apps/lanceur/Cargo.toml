[package]
name = "lanceur"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "Lanceur de VIctory : réglages, lancement, fps en direct, présence Discord, sauvegardes par endroit"

# Une application à part, hors de l'espace de travail du jeu : ses
# dépendances (fenêtre, Discord) ne touchent pas au Cargo.lock du jeu.
[workspace]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
discord-rich-presence = "1.1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[profile.release]
opt-level = 2
strip = true
